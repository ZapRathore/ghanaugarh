<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ब्लॉग | घणाऊ गढ़ वंशावली</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4165605109897999"
     crossorigin="anonymous"></script>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box}
:root{--bg:#f2f4f8;--bg2:#ffffff;--ink:#14213d;--muted:#5a6478;--accent:#1f3a68;--accent-ink:#ffffff;--gold:#a8842c;--glass:rgba(255,255,255,.88);--stroke:rgba(20,33,61,.14);--shadow:0 6px 24px rgba(20,33,61,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c111a;--bg2:#161d2b;--ink:#e8ecf3;--muted:#9aa6ba;--accent:#d8b45f;--accent-ink:#0c111a;--gold:#d8b45f;--glass:rgba(22,29,43,.88);--stroke:rgba(255,255,255,.13);--shadow:0 8px 28px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0c111a;--bg2:#161d2b;--ink:#e8ecf3;--muted:#9aa6ba;--accent:#d8b45f;--accent-ink:#0c111a;--gold:#d8b45f;--glass:rgba(22,29,43,.88);--stroke:rgba(255,255,255,.13);--shadow:0 8px 28px rgba(0,0,0,.45)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg2),var(--bg)) fixed;min-height:100vh;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--stroke);border-radius:14px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;border-left:4px solid var(--gold);margin-bottom:22px}
.top h1{margin:0;font:400 24px/1.2 'Tiro Devanagari Hindi',serif}
.top small{display:block;color:var(--muted);font-size:13px}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--stroke);border-radius:99px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.card{display:block;padding:18px 20px;margin-bottom:14px;color:inherit;text-decoration:none;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card h2{margin:0 0 4px;font:400 21px/1.3 'Tiro Devanagari Hindi',serif}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;border:1px solid var(--stroke);margin-right:6px}
.card p{margin:8px 0 0}
article{padding:22px 24px}
article h1{margin:0 0 6px;font:400 30px/1.25 'Tiro Devanagari Hindi',serif}
article img{max-width:100%;height:auto;border-radius:10px}
article .body{margin-top:16px;font-size:17px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top glass">
    <div><h1>ब्लॉग</h1><small>घणाऊ गढ़ वंशावली · Ghanau Bika Rathore</small></div>
    <a class="btn" href="index.html">← वंशावली / Family Tree</a>
  </header>

  <main>
    <section id="list"></section>
    <section id="post" hidden>
      <p><a class="btn" href="#">← सभी ब्लॉग / All posts</a></p>
      <article class="glass" id="postBody"></article>
    </section>
  </main>
</div>

<script>
/* Blogs ab posts.json se aate hain. Naya blog admin.html ke form se daalein. */
let POSTS = [];

/* ---------------- code (isko chhedna nahi hai) ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => { try { return new Date(d + 'T00:00:00').toLocaleDateString('hi-IN', {day:'numeric', month:'long', year:'numeric'}); } catch (e) { return d; } };
let sorted = [];

function render() {
  const id = decodeURIComponent(location.hash.slice(1));
  const p = sorted.find(x => x.id === id);
  $('list').hidden = !!p;
  $('post').hidden = !p;
  if (p) {
    document.title = p.title + ' | घणाऊ गढ़ वंशावली';
    $('postBody').innerHTML =
      '<h1>' + esc(p.title) + '</h1>' +
      '<div class="meta">' + (p.tag ? '<span class="tag">' + esc(p.tag) + '</span>' : '') + esc(fmt(p.date)) + '</div>' +
      '<div class="body">' + p.body + '</div>';
    window.scrollTo(0, 0);
    return;
  }
  document.title = 'ब्लॉग | घणाऊ गढ़ वंशावली';
  $('list').innerHTML = sorted.length ? sorted.map(x =>
    '<a class="card glass" href="#' + encodeURIComponent(x.id) + '">' +
      '<h2>' + esc(x.title) + '</h2>' +
      '<div class="meta">' + (x.tag ? '<span class="tag">' + esc(x.tag) + '</span>' : '') + esc(fmt(x.date)) + '</div>' +
      (x.summary ? '<p>' + esc(x.summary) + '</p>' : '') +
    '</a>').join('') : '<p class="empty">अभी कोई ब्लॉग नहीं है।</p>';
}
addEventListener('hashchange', render);
fetch('posts.json?v=' + Date.now()).then(r => r.ok ? r.json() : []).catch(() => []).then(d => {
  POSTS = Array.isArray(d) ? d : [];
  sorted = POSTS.slice().sort((a, b) => b.date.localeCompare(a.date));
  render();
});

/* same day/night theme as the main page */
try { const t = localStorage.getItem('rathore-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="/baisa.js" charset="utf-8" defer></script>
</body>
</html>
