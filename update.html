<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Updates | घणाऊ गढ़ वंशावली</title>
<meta name="description" content="Latest updates and news from Ghanaugarh family record keeper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box}
:root{--bg:#f2f4f8;--bg2:#ffffff;--ink:#14213d;--muted:#5a6478;--accent:#1f3a68;--accent-ink:#ffffff;--gold:#a8842c;--stroke:rgba(20,33,61,.14);--shadow:0 6px 24px rgba(20,33,61,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c111a;--bg2:#161d2b;--ink:#e8ecf3;--muted:#9aa6ba;--accent:#d8b45f;--accent-ink:#0c111a;--gold:#d8b45f;--stroke:rgba(255,255,255,.13);--shadow:0 8px 28px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0c111a;--bg2:#161d2b;--ink:#e8ecf3;--muted:#9aa6ba;--accent:#d8b45f;--accent-ink:#0c111a;--gold:#d8b45f;--stroke:rgba(255,255,255,.13);--shadow:0 8px 28px rgba(0,0,0,.45)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Hind',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:12px;padding:10px 16px}
header .home{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
header img{width:34px;height:34px;border-radius:8px}
header b{font:400 18px/1.2 'Tiro Devanagari Hindi',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header nav{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--stroke);border-radius:99px;padding:7px 14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:780px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0 0 4px;font:400 28px/1.25 'Tiro Devanagari Hindi',serif}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.card{display:block;border:1px solid var(--stroke);border-radius:14px;background:var(--bg2);padding:14px 18px;margin:0 0 10px;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.card .t{font:400 19px/1.35 'Tiro Devanagari Hindi',serif;overflow-wrap:anywhere}
.card .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.msg{padding:18px;border:1px dashed var(--stroke);border-radius:14px;color:var(--muted)}
.msg small{display:block;margin-top:6px}
article{background:var(--bg2);border:1px solid var(--stroke);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
article h1{font-size:26px;overflow-wrap:anywhere}
.date{color:var(--muted);font-size:13px;margin:0 0 14px}
.body{font-size:16px;line-height:1.75;overflow-wrap:anywhere}
.body h1,.body h2,.body h3,.body h4{font-family:'Tiro Devanagari Hindi',serif;font-weight:400;line-height:1.3;margin:16px 0 6px}
.body h1{font-size:22px}.body h2{font-size:20px}.body h3,.body h4{font-size:17px}
.body p{margin:0 0 10px}.body ul,.body ol{padding-left:22px;margin:0 0 10px}
.body img{max-width:100%;height:auto;border-radius:8px}
.body a{color:var(--accent)}
.body .tw{overflow-x:auto;margin:0 0 12px}
.body table{border-collapse:collapse;min-width:100%}
.body td,.body th{border:1px solid var(--stroke);padding:6px 10px;vertical-align:top}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--stroke)}
.foot a.dl{color:var(--accent);font-size:13.5px}
.back{display:inline-block;margin:0 0 14px;color:var(--accent);text-decoration:none;font-size:14px}
.back:hover{text-decoration:underline}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="home" href="./" aria-label="Home"><img src="favicon.png" alt="" onerror="this.style.display='none'"><b>घणाऊ गढ़ वंशावली</b></a>
  <nav><a class="btn" href="./">Home</a><a class="btn" href="blog.html">Blog</a></nav>
</header>
<main id="app" aria-live="polite"><div class="msg">Loading updates…</div></main>
<div id="toast" role="status"></div>

<script>
// ---------- Settings (same as the home page) ----------
const UPDATES = { owner: 'ZapRathore', repo: 'ghanaugarh', folder: 'updates' };
const NEWS_EXT = /\.(docx|jpe?g|png|gif|webp|bmp|svg|pdf|txt)$/i;
const IMG_EXT = /\.(jpe?g|png|gif|webp|bmp|svg)$/i;
const MAMMOTH_URLS = ['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js', 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js'];
const $ = id => document.getElementById(id);
const app = $('app');

function updatesSource() {
  let o = UPDATES.owner, r = UPDATES.repo; const h = location.hostname;
  if (!o && h.endsWith('.github.io')) o = h.split('.')[0];
  if (o && !r) { const seg = location.pathname.split('/')[1] || ''; r = (seg && !/\.html?$/i.test(seg)) ? seg : o + '.github.io'; }
  return o && r ? { o, r, f: UPDATES.folder } : null;
}
function parseNewsItem(x) {
  const base = x.name.replace(NEWS_EXT, '');
  let ts = 0, title = base, m;
  if ((m = base.match(/(\d{4})[-_.](\d{1,2})[-_.](\d{1,2})/))) { ts = Date.UTC(+m[1], +m[2] - 1, +m[3]); title = base.replace(m[0], ''); }
  else if ((m = base.match(/(\d{1,2})[-_.](\d{1,2})[-_.](\d{4})/))) { ts = Date.UTC(+m[3], +m[2] - 1, +m[1]); title = base.replace(m[0], ''); }
  title = title.replace(/[_]+/g, ' ').replace(/^[\s\-–.]+|[\s\-–.]+$/g, '').replace(/\s+/g, ' ');
  const kind = /\.docx$/i.test(x.name) ? 'docx' : IMG_EXT.test(x.name) ? 'img' : /\.pdf$/i.test(x.name) ? 'pdf' : 'txt';
  return { name: x.name, slug: base, sha: x.sha, url: x.download_url, title: title || base, ts, kind };
}
async function fetchManifest() {
  // written by the GitHub Action: one static, shareable page per update
  try {
    const r = await fetch('u/manifest.json', { cache: 'no-cache' }); if (!r.ok) return null;
    const arr = await r.json(); if (!Array.isArray(arr) || !arr.length) return null;
    return arr.map(x => ({ name: x.name, slug: x.slug, title: x.title, ts: x.ts, kind: x.kind, sha: x.slug, static: true,
      url: 'updates/' + x.name.split('/').map(encodeURIComponent).join('/') }));
  } catch (e) { return null; }
}
async function fetchNews(force) {
  const m = await fetchManifest(); if (m) return m;
  const src = updatesSource(); if (!src) throw { code: 'config' };
  const key = 'rathore-news-cache-v3';
  try { if (!force) { const c = JSON.parse(sessionStorage.getItem(key) || 'null'); if (c && Date.now() - c.t < 600000) return c.items; } } catch (e) {}
  const r = await fetch(`https://api.github.com/repos/${src.o}/${src.r}/contents/${src.f.split('/').map(encodeURIComponent).join('/')}`, { headers: { Accept: 'application/vnd.github+json' } });
  if (r.status === 404) throw { code: 'nofolder' };
  if (r.status === 403 || r.status === 429) throw { code: 'limit' };
  if (!r.ok) throw { code: 'http' };
  const arr = await r.json();
  const items = arr.filter(x => x.type === 'file' && NEWS_EXT.test(x.name) && !x.name.startsWith('~$')).map(parseNewsItem)
    .sort((a, b) => (b.ts - a.ts) || b.name.localeCompare(a.name));
  try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), items })); } catch (e) {}
  return items;
}
// same "seen" key as the home page, so the red dot there clears
const newsSig = items => items.map(i => i.sha).join('|');
function markSeen(items) { try { localStorage.setItem('rathore-news-seen', newsSig(items)); } catch (e) {} }

function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form,svg').forEach(e => e.remove());
  doc.body.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase(), v = a.value.trim();
      if (n.startsWith('on') || n === 'style') el.removeAttribute(a.name);
      else if (n === 'href' && !/^(https?:|mailto:|tel:|#)/i.test(v)) el.removeAttribute(a.name);
      else if (n === 'src' && !/^(data:image\/(png|jpe?g|gif|webp);|https:)/i.test(v)) el.removeAttribute(a.name);
    });
    if (el.tagName === 'A') { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
  });
  return doc.body.innerHTML;
}
function loadScript(src) { return new Promise((ok, no) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = no; document.head.appendChild(t); }); }
let mammothP = null;
function loadMammoth() {
  if (window.mammoth) return Promise.resolve();
  return mammothP || (mammothP = loadScript(MAMMOTH_URLS[0]).catch(() => loadScript(MAMMOTH_URLS[1])).catch(e => { mammothP = null; throw e; }));
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) : '';

// ---------- Clean links: https://ghanaugarh.co.in/update?u=<name>  (no .html) ----------
function updateLink(item) {
  if (item.static) return new URL('u/' + item.slug, location.href).href;   // https://ghanaugarh.co.in/u/<id>
  const page = /^https?:$/.test(location.protocol) ? 'update' : 'update.html';
  return new URL(page + '?u=' + encodeURIComponent(item.slug), location.href).href;
}

function setMeta(title) {
  document.title = title ? title + ' | घणाऊ गढ़ वंशावली' : 'Updates | घणाऊ गढ़ वंशावली';
}
function message(text, small) {
  app.textContent = '';
  const d = document.createElement('div'); d.className = 'msg'; d.textContent = text;
  if (small) { const s = document.createElement('small'); s.textContent = small; d.appendChild(s); }
  app.appendChild(d);
}
function errorMessage(e) {
  const code = e && e.code;
  if (code === 'config') message('Updates are not connected yet.', 'For the site owner: set owner and repo in the UPDATES settings in the page code.');
  else if (code === 'nofolder') message('The updates folder was not found.', `For the site owner: create a folder named "${UPDATES.folder}" in the GitHub repository and upload .docx, .jpg, .png or .pdf files there.`);
  else if (code === 'limit') message('GitHub is limiting requests right now. Please try again in a few minutes.');
  else message('Could not load updates. Please check your internet connection and refresh the page.');
}

// ---------- List page ----------
function renderList(items) {
  setMeta('');
  app.textContent = '';
  const h = document.createElement('h1'); h.textContent = 'Latest updates & news';
  const p = document.createElement('p'); p.className = 'sub';
  p.textContent = items.length ? items.length + (items.length === 1 ? ' update' : ' updates') + ', newest first.' : 'Notices and news from the family record keeper.';
  app.append(h, p);
  if (!items.length) { const d = document.createElement('div'); d.className = 'msg'; d.textContent = 'No updates have been posted yet. Please check again soon.'; app.appendChild(d); return; }
  items.forEach(it => {
    const a = document.createElement('a'); a.className = 'card';
    a.href = it.static ? 'u/' + it.slug : '?u=' + encodeURIComponent(it.slug);
    const t = document.createElement('div'); t.className = 't'; t.textContent = it.title;
    const d = document.createElement('div'); d.className = 'd'; d.textContent = fmtDate(it.ts);
    a.append(t, d); app.appendChild(a);
  });
}

// ---------- Single update page ----------
async function loadBody(item, box) {
  box.textContent = 'Loading…';
  try {
    if (item.kind === 'img') {
      const im = document.createElement('img'); im.alt = item.title;
      im.onerror = () => { box.innerHTML = '<p>Could not open this image here. Please use the link below.</p>'; };
      im.src = item.url; box.textContent = ''; box.appendChild(im); return;
    }
    if (item.kind === 'pdf') {
      const fr = document.createElement('iframe'); fr.src = item.url; fr.title = item.title;
      fr.style.cssText = 'width:100%;height:75vh;border:1px solid var(--stroke);border-radius:8px;background:#fff';
      box.textContent = ''; box.appendChild(fr); return;
    }
    if (item.kind === 'txt') {
      const r = await fetch(item.url); if (!r.ok) throw new Error('file');
      const pre = document.createElement('div'); pre.style.whiteSpace = 'pre-wrap'; pre.textContent = await r.text();
      box.textContent = ''; box.appendChild(pre); return;
    }
    await loadMammoth();
    const r = await fetch(item.url); if (!r.ok) throw new Error('file');
    const out = await mammoth.convertToHtml({ arrayBuffer: await r.arrayBuffer() });
    box.innerHTML = sanitizeHtml(out.value) || '<p>This document is empty.</p>';
    box.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });
  } catch (e) { box.innerHTML = '<p>Could not open this file here. Please use the link below.</p>'; }
}
async function photoBlob(item, box) {
  try {
    if (item.kind === 'img') { const r = await fetch(item.url); return r.ok ? await r.blob() : null; }
    if (item.kind === 'docx') { const im = box.querySelector('img'); if (!im || !im.src) return null; const r = await fetch(im.src); return r.ok ? await r.blob() : null; }
  } catch (e) {}
  return null;
}
async function shareItem(item, box, btn) {
  const label = btn.lastChild.textContent; btn.disabled = true; btn.lastChild.textContent = ' Preparing…';
  try {
    const link = updateLink(item);
    const text = item.title + '\n\n' + link;
    const blob = await photoBlob(item, box);
    let file = null;
    if (blob && /^image\//.test(blob.type)) {
      const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
      file = new File([blob], (item.title || 'update').replace(/[^\w\u0900-\u097F -]+/g, '').trim().slice(0, 40).replace(/\s+/g, '-') + '.' + ext, { type: blob.type });
    }
    if (navigator.share) {
      try {
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: item.title, text }); return; }
        await navigator.share({ title: item.title, text }); return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
  } finally { btn.disabled = false; btn.lastChild.textContent = label; }
}
async function copyLink(item) {
  const link = updateLink(item);
  try { await navigator.clipboard.writeText(link); toast('Link copied'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = link; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Link copied'); } catch (_) { toast(link); } ta.remove(); }
}
function renderOne(item) {
  setMeta(item.title);
  app.textContent = '';
  const back = document.createElement('a'); back.className = 'back'; back.href = location.pathname; back.textContent = '← All updates';
  back.onclick = e => { e.preventDefault(); history.pushState(null, '', location.pathname); route(); };
  const art = document.createElement('article');
  const h = document.createElement('h1'); h.textContent = item.title;
  const d = document.createElement('p'); d.className = 'date'; d.textContent = fmtDate(item.ts);
  const body = document.createElement('div'); body.className = 'body';
  const foot = document.createElement('div'); foot.className = 'foot';
  const sb = document.createElement('button'); sb.type = 'button'; sb.className = 'btn';
  sb.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';
  sb.appendChild(document.createTextNode(' Share'));
  sb.onclick = () => shareItem(item, body, sb);
  const cb = document.createElement('button'); cb.type = 'button'; cb.className = 'btn'; cb.textContent = 'Copy link'; cb.onclick = () => copyLink(item);
  const a = document.createElement('a'); a.className = 'dl'; a.href = item.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.textContent = item.kind === 'docx' ? 'Download the Word file' : item.kind === 'img' ? 'Open the full image' : item.kind === 'pdf' ? 'Open the PDF' : 'Download the file';
  foot.append(sb, cb, a);
  art.append(h, d, body, foot);
  app.append(back, art);
  loadBody(item, body);
  window.scrollTo(0, 0);
}

// ---------- Router: /update  = list,  /update?u=<name>  = one update ----------
let ITEMS = null;
async function route() {
  const u = new URLSearchParams(location.search).get('u');
  message('Loading updates…');
  try {
    if (!ITEMS) ITEMS = await fetchNews(false);
    if (!u) { markSeen(ITEMS); return renderList(ITEMS); }
    const item = ITEMS.find(x => x.slug === u || x.name === u);
    if (!item) {
      // maybe it was posted after the cached list — refresh once
      ITEMS = await fetchNews(true);
      const again = ITEMS.find(x => x.slug === u || x.name === u);
      if (!again) { message('This update was not found. It may have been removed.'); const a = document.createElement('a'); a.className = 'back'; a.href = location.pathname; a.textContent = '← All updates'; a.style.marginTop = '12px'; app.appendChild(a); return; }
      markSeen(ITEMS); return renderOne(again);
    }
    markSeen(ITEMS); renderOne(item);
  } catch (e) { errorMessage(e); }
}
addEventListener('popstate', route);
route();
</script>
<script>window.BAISA_CONFIG={endpoint:"https://baisa.lazyboyx55.workers.dev"};</script>
